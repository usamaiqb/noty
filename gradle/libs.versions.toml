# Single source of truth for dependency and build-plugin versions.
# Dependabot watches this file; see .github/dependabot.yml.

[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"
detekt = "1.23.8"
easylauncher = "6.4.1"
detektComposeRules = "0.6.8"

androidxCore = "1.19.1"
material = "1.14.0"
lifecycle = "2.7.0"
# 2.7.x required for KSP2 / AGP built-in Kotlin compatibility
room = "2.8.5"
datastore = "1.3.0"
kotlinxSerialization = "1.12.0"
splashscreen = "1.2.0"
composeBom = "2026.09.00"
# material3 is pinned past the BOM because MaterialExpressiveTheme and MotionScheme are
# internal in every stable release, 1.4.0 included. Note this cascades: 1.5.0-alpha15 needs
# newer foundation, so compose.ui and compose.animation resolve to 1.11.0-alpha06 too — the
# pin puts the whole Compose core on alpha, not just material3. Drop it the moment the
# Expressive APIs ship stable, and re-check that NotyTheme still compiles without the opt-in.
material3 = "1.5.0-alpha15"

junit = "4.13.2"
androidxTestJunit = "1.1.5"
espresso = "3.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Versions below come from the Compose BOM, so they are deliberately absent here.
# material3 is the one exception; see the note beside its version above.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose" }

# Kotlin static analysis, including the Compose rule set
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektComposeRules" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
easylauncher = { id = "com.starter.easylauncher", version.ref = "easylauncher" }
room = { id = "androidx.room", version.ref = "room" }
