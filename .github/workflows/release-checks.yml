name: Release Checks

on:
  push:
    branches:
      - 'release/v*'

jobs:
  validate:
    name: Validate release PR
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Extract versions from release branch
        id: pr
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          [ -z "$VERSION_CODE" ] && echo "❌ Could not parse versionCode from app/build.gradle" && exit 1
          [ -z "$VERSION_NAME" ] && echo "❌ Could not parse versionName from app/build.gradle" && exit 1
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Extract versions from main
        id: base
        run: |
          BASE_CODE=$(git show origin/main:app/build.gradle | grep -oP 'versionCode\s+\K\d+')
          BASE_NAME=$(git show origin/main:app/build.gradle | grep -oP 'versionName\s+"\K[^"]+')
          [ -z "$BASE_CODE" ] && echo "❌ Could not parse versionCode from main" && exit 1
          [ -z "$BASE_NAME" ] && echo "❌ Could not parse versionName from main" && exit 1
          echo "version_code=$BASE_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$BASE_NAME" >> $GITHUB_OUTPUT

      - name: versionCode incremented by exactly 1
        env:
          NEW: ${{ steps.pr.outputs.version_code }}
          OLD: ${{ steps.base.outputs.version_code }}
        run: |
          EXPECTED=$((OLD + 1))
          if [ "$NEW" != "$EXPECTED" ]; then
            echo "❌ versionCode must be $EXPECTED (was $OLD on main, got $NEW)"
            exit 1
          fi
          echo "✅ versionCode: $OLD → $NEW"

      - name: versionName changed
        env:
          NEW: ${{ steps.pr.outputs.version_name }}
          OLD: ${{ steps.base.outputs.version_name }}
        run: |
          if [ "$NEW" = "$OLD" ]; then
            echo "❌ versionName was not changed (still $OLD)"
            exit 1
          fi
          echo "✅ versionName: $OLD → $NEW"

      - name: Branch name matches versionName
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.pr.outputs.version_name }}
        run: |
          EXPECTED="release/v$VERSION"
          if [ "$BRANCH" != "$EXPECTED" ]; then
            echo "❌ Branch '$BRANCH' does not match versionName '$VERSION' (expected '$EXPECTED')"
            exit 1
          fi
          echo "✅ Branch matches version: $BRANCH"

      - name: CHANGELOG.md has entry for new version
        env:
          VERSION: ${{ steps.pr.outputs.version_name }}
        run: |
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md has no entry for ## [$VERSION]"
            exit 1
          fi
          echo "✅ CHANGELOG.md contains entry for $VERSION"

      - name: F-Droid changelog exists and is non-empty
        env:
          VERSION_CODE: ${{ steps.pr.outputs.version_code }}
        run: |
          FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -f "$FILE" ]; then
            echo "❌ Missing F-Droid changelog: $FILE"
            exit 1
          fi
          if [ ! -s "$FILE" ]; then
            echo "❌ F-Droid changelog is empty: $FILE"
            exit 1
          fi
          echo "✅ F-Droid changelog present: $FILE"
          echo "--- contents ---"
          cat "$FILE"

      # Google Play rejects the whole upload when one field is over its limit, and that
      # upload runs only after the tag. Characters, not bytes: `wc -m` under a UTF-8 locale.
      # supply sends a file as it is, so line breaks count; only the final one is dropped.
      - name: Store listing fits Google Play's limits
        env:
          LC_ALL: C.UTF-8
          VERSION_CODE: ${{ steps.pr.outputs.version_code }}
        run: |
          FAIL=0
          check() {
            [ -f "$1" ] || return 0
            LEN=$(printf '%s' "$(cat "$1")" | wc -m)
            if [ "$LEN" -gt "$2" ]; then
              echo "❌ $1 is $LEN characters; Google Play allows $2"
              FAIL=1
            else
              echo "✅ $1: $LEN / $2"
            fi
          }
          for DIR in fastlane/metadata/android/*/; do
            check "${DIR}title.txt" 30
            check "${DIR}short_description.txt" 80
            check "${DIR}full_description.txt" 4000
            check "${DIR}changelogs/${VERSION_CODE}.txt" 500
          done
          exit $FAIL

      # The table is normally kept current by translation-table.yml's bot PR; this
      # catches a release cut while that PR is still open.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: README translation table is up to date
        run: bash scripts/translation-status.sh --check
