name: Translation table

# Keeps the README translation table current without failing anyone's PR.
#
# Translation PRs come from forks, which the workflow token cannot push to, so the
# table is refreshed after merge instead: when strings land on main, this regenerates
# the table and opens (or updates) a single PR from bot/translation-table. Main's
# ruleset requires a PR, so pushing to main directly is not an option either.
#
# PRs opened with the workflow token do not trigger other workflows, so the required
# checks will not run on the bot PR on their own. Close and reopen it to run them, or
# merge with the admin bypass. Needs "Allow GitHub Actions to create and approve pull
# requests" enabled under Settings → Actions → General.
on:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/resources.properties'
      - 'scripts/translation-status.sh'
      - 'scripts/LanguageNames.java'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Only the newest main matters; an older run would push a table that is already stale.
concurrency:
  group: translation-table
  cancel-in-progress: true

env:
  BRANCH: bot/translation-table
  TITLE: 'docs: update translation table'

jobs:
  update:
    name: Update translation table
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate table
        run: bash scripts/translation-status.sh

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if git diff --quiet -- README.md; then
            echo "Table is up to date."
            # A manual fix or a reverted string can make an open bot PR pointless.
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment "The table on main is already up to date."
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          # The branch only ever holds this one generated commit on top of main.
          git push --force origin "$BRANCH"

          if [ -n "$open_pr" ]; then
            echo "Updated PR #$open_pr."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body \
              "Regenerated by \`scripts/translation-status.sh\` after strings changed on main.

          Checks do not run on PRs opened by the workflow token. Close and reopen this PR to run them, or merge with the admin bypass."
          fi
